name: Template for bootc builders
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      containerfiles:
        required: true
        type: string
      archs:
        required: false
        type: string
        default: ""
      build-args:
        required: false
        type: string
        default: ""
      # Newline-separated build input paths. When set, same-repo PR builds are
      # pushed as `tree-<hash>` and a default-branch push with a matching tag
      # promotes that image instead of rebuilding. Only safe when every FROM
      # under these paths is pinned by digest.
      source_path:
        required: false
        type: string
        default: ""

# Serializes builds per image so two merges landing close together can't race
# to push `latest` out of order (an earlier commit's build finishing after a
# later commit's build would otherwise clobber the newer image). PRs get their
# own group: a group holds only one pending run, so a queued PR build would
# otherwise cancel a pending default-branch build.
concurrency:
  group: bootc-build-${{ github.repository }}-${{ inputs.image_name }}${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Decide whether to build or promote
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      SOURCE_PATH: ${{ inputs.source_path }}
      CONTAINERFILES: ${{ inputs.containerfiles }}
      BUILD_ARGS: ${{ inputs.build-args }}
      ARCHS: ${{ inputs.archs }}
      SHA: ${{ github.sha }}
      EVENT: ${{ github.event_name }}
      IS_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
      SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      promote: ${{ steps.plan.outputs.promote }}
      tree_tag: ${{ steps.plan.outputs.tree_tag }}
      tags: ${{ steps.plan.outputs.tags }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - name: Clone the repository
        if: inputs.source_path != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container registry
        if: inputs.source_path != '' && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Compute tree tag and plan
        id: plan
        run: |
          tree_tag=""
          if [ -n "$SOURCE_PATH" ]; then
            trees=$(while read -r p; do
              [ -n "$p" ] || continue
              p=${p%/}
              echo "$p:$(git rev-parse "HEAD:$p")"
            done <<<"$SOURCE_PATH" | sort)
            hash=$(printf '%s\n' "$trees" -- "$CONTAINERFILES" -- "$BUILD_ARGS" -- "$ARCHS" | sha256sum | cut -d' ' -f1)
            tree_tag="tree-$hash"
          fi

          promote=false
          push=false
          tags="latest $SHA"
          if [ "$IS_DEFAULT" = true ]; then
            push=true
            [ -z "$tree_tag" ] || tags="$tags $tree_tag"
            # schedule/workflow_dispatch/workflow_run exist to pick up fresh
            # packages or a rebuilt base, so only a plain push may promote.
            if [ "$EVENT" = push ] && [ -n "$tree_tag" ] \
              && skopeo inspect --raw "docker://$IMAGE_REF:$tree_tag" >/dev/null 2>&1; then
              promote=true
            fi
          elif [ "$EVENT" = pull_request ] && [ "$SAME_REPO_PR" = true ] && [ -n "$tree_tag" ]; then
            push=true
            tags="$tree_tag"
          fi

          echo "tree_tag=$tree_tag promote=$promote push=$push tags=$tags"
          {
            echo "tree_tag=$tree_tag"
            echo "promote=$promote"
            echo "push=$push"
            echo "tags=$tags"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Promote the PR-built image
    needs: plan
    if: needs.plan.outputs.promote == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      TREE_TAG: ${{ needs.plan.outputs.tree_tag }}
      SHA: ${{ github.sha }}
    steps:
      - name: Log in to the GitHub Container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Copy tree tag to latest and commit tags
        run: |
          for tag in "$SHA" latest; do
            skopeo copy --all --preserve-digests \
              "docker://$IMAGE_REF:$TREE_TAG" "docker://$IMAGE_REF:$tag"
          done

  subs:
    name: Build RHEL bootc image with repo access
    needs: plan
    if: needs.plan.outputs.promote != 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_NAME: ${{ github.repository_owner }}/${{ inputs.image_name }}
      REGISTRY: ghcr.io
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      # Cache scope is per calling repository, so this never crosses repo
      # boundaries even though this workflow file is public.
      - name: Cache dnf package downloads
        uses: actions/cache@v6
        with:
          path: /var/cache/dnf
          key: dnf-fedora-latest-bootc-tools-v1
          restore-keys: |
            dnf-fedora-latest-bootc-tools-

      - name: Get container tools in UBI builder
        run: dnf -y install podman buildah skopeo qemu-user-static

      - name: Register multiarch
        run: podman run --rm --privileged --cgroups=disabled docker.io/tonistiigi/binfmt --install all

      - name: Access a subscription via activation key
        env:
          SMDEV_CONTAINER_OFF: 1
          orgid: ${{ secrets.RHT_ORGID }}
          activation_key: ${{ secrets.RHT_ACT_KEY }}
        run: |
          dnf -y install subscription-manager
          subscription-manager register --org=$orgid --activationkey=$activation_key

      # workaround for https://github.com/redhat-actions/podman-login/issues/42 since the docker config from the host doesn't come up to the container
      - name: Workaround open podman-login action issue
        env:
          auth: '{ "auths": {} }'
        run: |
          mkdir -p $HOME/.docker
          echo $auth > $HOME/.docker/config.json

      - name: Log in to the RHT terms based registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RHT_REG_SVCUSER }}
          password: ${{ secrets.RHT_REG_SVCPASS }}
          auth_file_path: /run/containers/0/auth.json

      - name: Log in to the GitHub Container registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: /run/containers/0/auth.json

      - name: Use buildah bud to create the image
        id: build-image
        uses: redhat-actions/buildah-build@v3
        with:
          image: ${{ env.IMAGE_NAME }}
          tags: ${{ needs.plan.outputs.tags }}
          containerfiles: ${{ inputs.containerfiles }}
          archs: ${{ inputs.archs }}
          build-args: ${{ inputs.build-args }}

      - name: Push to GitHub Container Repository
        id: push-to-ghcr
        uses: redhat-actions/push-to-registry@v3
        if: needs.plan.outputs.push == 'true'
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: ${{ env.REGISTRY }}

      - name: Clean up the subscription
        if: always()
        env:
          SMDEV_CONTAINER_OFF: 1
        run: subscription-manager unregister

  prune:
    name: Prune old image versions
    needs: [plan, promote, subs]
    if: >-
      always()
      && github.ref_name == github.event.repository.default_branch
      && (needs.promote.result == 'success' || needs.subs.result == 'success')
    # Downstream variant builds trigger on this run's success via workflow_run,
    # so a failed prune must not fail the run.
    continue-on-error: true
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
      PACKAGE: ${{ inputs.image_name }}
      KEEP_RELEASES: 5
      TREE_MAX_AGE_DAYS: 14
      UNTAGGED_MIN_AGE_HOURS: 24
    steps:
      - name: Log in to the GitHub Container registry
        run: echo "$GH_TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      # Keeps anything tagged other than `<sha>`/`tree-<hash>` (e.g. latest),
      # the newest KEEP_RELEASES `<sha>`-tagged versions, `tree-*`-only
      # versions younger than TREE_MAX_AGE_DAYS, and per-arch manifests that a
      # kept manifest list references. Untagged versions get an age guard
      # because a concurrent PR push uploads them before its manifest list.
      - name: Delete unneeded versions
        run: |
          set -euo pipefail
          if [ "$(gh api "/users/$OWNER" --jq .type)" = Organization ]; then
            api="/orgs/$OWNER"
          else
            api="/users/$OWNER"
          fi
          api="$api/packages/container/${PACKAGE//\//%2F}/versions"

          gh api --paginate "$api?per_page=100" --jq '.[]' \
            | jq -s 'sort_by(.created_at) | reverse' > versions.json

          jq -r \
            --argjson now "$(date +%s)" \
            --argjson keep "$KEEP_RELEASES" \
            --argjson tree_age "$((TREE_MAX_AGE_DAYS * 86400))" '
            def tags: .metadata.container.tags;
            def age: $now - (.created_at | fromdateiso8601);
            def other_tag: any(tags[]; test("^(tree-[0-9a-f]{64}|[0-9a-f]{40})$") | not);
            def release: any(tags[]; test("^[0-9a-f]{40}$"));
            [.[] | select((tags | length) > 0 and (other_tag | not))]
            | ([.[] | select(release)] | .[$keep:])
              + [.[] | select((release | not) and age > $tree_age)]
            | .[] | "\(.id) \(.name) \(.metadata.container.tags | join(","))"
          ' versions.json > delete_tagged.txt

          # Kept manifest lists protect their per-arch children.
          : > protected.txt
          jq -r '.[] | select((.metadata.container.tags | length) > 0) | .name' versions.json \
            | while read -r digest; do
                grep -q " $digest " delete_tagged.txt && continue
                skopeo inspect --raw "docker://ghcr.io/$OWNER/$PACKAGE@$digest" \
                  | jq -r '.manifests[]?.digest' >> protected.txt
              done

          jq -r \
            --argjson now "$(date +%s)" \
            --argjson min_age "$((UNTAGGED_MIN_AGE_HOURS * 3600))" \
            --rawfile protected protected.txt '
            ($protected | split("\n")) as $p
            | .[]
            | select((.metadata.container.tags | length) == 0)
            | select($now - (.created_at | fromdateiso8601) > $min_age)
            | select(.name | IN($p[]) | not)
            | "\(.id) \(.name) (untagged)"
          ' versions.json > delete_untagged.txt

          cat delete_tagged.txt delete_untagged.txt | while read -r id name tags; do
            if gh api -X DELETE "$api/$id" --silent; then
              echo "Deleted $name $tags"
            else
              echo "::warning::Failed to delete $name $tags"
            fi
          done
