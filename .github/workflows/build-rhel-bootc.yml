name: Template for bootc builders
on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      containerfiles:
        required: true
        type: string
      # Comma- or space-separated: x86_64 (amd64) and/or arm64 (aarch64). Each
      # arch builds on a native runner, so its subscription registers for that
      # arch's content. Empty means x86_64.
      archs:
        required: false
        type: string
        default: ""
      build-args:
        required: false
        type: string
        default: ""
      # Newline-separated build input paths. When set, same-repo PR builds are
      # pushed as `tree-<hash>` and a default-branch push with a matching tag
      # promotes that image instead of rebuilding. Only safe when every FROM
      # under these paths is pinned by digest.
      source_path:
        required: false
        type: string
        default: ""
      # false builds without pushing, promoting or pruning (e.g. test builds).
      publish:
        required: false
        type: boolean
        default: true

# Serializes builds per image so two merges landing close together can't race
# to push `latest` out of order (an earlier commit's build finishing after a
# later commit's build would otherwise clobber the newer image). PRs get their
# own group: a group holds only one pending run, so a queued PR build would
# otherwise cancel a pending default-branch build.
concurrency:
  group: bootc-build-${{ github.repository }}-${{ inputs.image_name }}${{ github.event_name == 'pull_request' && format('-pr-{0}', github.event.pull_request.number) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Decide whether to build or promote
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      SOURCE_PATH: ${{ inputs.source_path }}
      CONTAINERFILES: ${{ inputs.containerfiles }}
      BUILD_ARGS: ${{ inputs.build-args }}
      ARCHS: ${{ inputs.archs }}
      PUBLISH: ${{ inputs.publish }}
      SHA: ${{ github.sha }}
      EVENT: ${{ github.event_name }}
      IS_DEFAULT: ${{ github.ref_name == github.event.repository.default_branch }}
      SAME_REPO_PR: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    outputs:
      promote: ${{ steps.plan.outputs.promote }}
      tree_tag: ${{ steps.plan.outputs.tree_tag }}
      tags: ${{ steps.plan.outputs.tags }}
      build_tag: ${{ steps.plan.outputs.build_tag }}
      builds: ${{ steps.plan.outputs.builds }}
      push: ${{ steps.plan.outputs.push }}
    steps:
      - name: Clone the repository
        if: inputs.source_path != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Log in to the GitHub Container registry
        if: inputs.source_path != '' && github.event_name == 'push'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Compute tree tag and plan
        id: plan
        run: |
          tree_tag=""
          if [ -n "$SOURCE_PATH" ]; then
            trees=$(while read -r p; do
              [ -n "$p" ] || continue
              p=${p%/}
              echo "$p:$(git rev-parse "HEAD:$p")"
            done <<<"$SOURCE_PATH" | sort)
            hash=$(printf '%s\n' "$trees" -- "$CONTAINERFILES" -- "$BUILD_ARGS" -- "$ARCHS" | sha256sum | cut -d' ' -f1)
            tree_tag="tree-$hash"
          fi

          promote=false
          push=false
          tags="latest $SHA"
          if [ "$IS_DEFAULT" = true ]; then
            push=true
            [ -z "$tree_tag" ] || tags="$tags $tree_tag"
            # schedule/workflow_dispatch/workflow_run exist to pick up fresh
            # packages or a rebuilt base, so only a plain push may promote.
            if [ "$EVENT" = push ] && [ -n "$tree_tag" ] \
              && skopeo inspect --raw "docker://$IMAGE_REF:$tree_tag" >/dev/null 2>&1; then
              promote=true
            fi
          elif [ "$EVENT" = pull_request ] && [ "$SAME_REPO_PR" = true ] && [ -n "$tree_tag" ]; then
            push=true
            tags="$tree_tag"
          fi

          if [ "$PUBLISH" != true ]; then
            promote=false
            push=false
          fi

          # Per-arch images are pushed as `<build_tag>-<arch>`, then joined
          # into the manifest list.
          if [ "$IS_DEFAULT" = true ]; then
            build_tag=$SHA
          else
            build_tag=$tree_tag
          fi

          builds='[]'
          for arch in $(echo "${ARCHS:-x86_64}" | tr ',' ' '); do
            case "$arch" in
              x86_64|amd64) entry='{"arch":"amd64","platform":"linux/amd64","runner":"ubuntu-latest"}' ;;
              arm64|aarch64) entry='{"arch":"arm64","platform":"linux/arm64","runner":"ubuntu-24.04-arm"}' ;;
              *) echo "::error::Unsupported arch: $arch"; exit 1 ;;
            esac
            builds=$(jq -c --argjson e "$entry" '. + [$e]' <<<"$builds")
          done

          echo "tree_tag=$tree_tag promote=$promote push=$push tags=$tags build_tag=$build_tag builds=$builds"
          {
            echo "tree_tag=$tree_tag"
            echo "promote=$promote"
            echo "push=$push"
            echo "tags=$tags"
            echo "build_tag=$build_tag"
            echo "builds=$builds"
          } >> "$GITHUB_OUTPUT"

  promote:
    name: Promote the PR-built image
    needs: plan
    if: needs.plan.outputs.promote == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      TREE_TAG: ${{ needs.plan.outputs.tree_tag }}
      SHA: ${{ github.sha }}
    steps:
      - name: Log in to the GitHub Container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | skopeo login ghcr.io -u "$ACTOR" --password-stdin

      - name: Copy tree tag to latest and commit tags
        run: |
          for tag in "$SHA" latest; do
            skopeo copy --all --preserve-digests \
              "docker://$IMAGE_REF:$TREE_TAG" "docker://$IMAGE_REF:$tag"
          done

  subs:
    name: Build RHEL bootc image with repo access (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.promote != 'true'
    strategy:
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      REGISTRY: ghcr.io
    container:
      image: registry.fedoraproject.org/fedora:latest
      options: --privileged

    steps:
      - name: Clone the repository
        uses: actions/checkout@v7

      # Cache scope is per calling repository, so this never crosses repo
      # boundaries even though this workflow file is public.
      - name: Cache dnf package downloads
        uses: actions/cache@v6
        with:
          path: /var/cache/dnf
          key: dnf-fedora-latest-bootc-tools-${{ matrix.arch }}-v1
          restore-keys: |
            dnf-fedora-latest-bootc-tools-${{ matrix.arch }}-

      - name: Get container tools in UBI builder
        run: dnf -y install podman buildah skopeo

      - name: Access a subscription via activation key
        env:
          SMDEV_CONTAINER_OFF: 1
          orgid: ${{ secrets.RHT_ORGID }}
          activation_key: ${{ secrets.RHT_ACT_KEY }}
        run: |
          dnf -y install subscription-manager
          subscription-manager register --org=$orgid --activationkey=$activation_key

      # workaround for https://github.com/redhat-actions/podman-login/issues/42 since the docker config from the host doesn't come up to the container
      - name: Workaround open podman-login action issue
        env:
          auth: '{ "auths": {} }'
        run: |
          mkdir -p $HOME/.docker
          echo $auth > $HOME/.docker/config.json

      - name: Log in to the RHT terms based registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: registry.redhat.io
          username: ${{ secrets.RHT_REG_SVCUSER }}
          password: ${{ secrets.RHT_REG_SVCPASS }}
          auth_file_path: /run/containers/0/auth.json

      - name: Log in to the GitHub Container registry
        uses: redhat-actions/podman-login@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          auth_file_path: /run/containers/0/auth.json

      - name: Build the image
        shell: bash
        env:
          CONTAINERFILES: ${{ inputs.containerfiles }}
          BUILD_ARGS: ${{ inputs.build-args }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          args=()
          while read -r f; do
            [ -n "$f" ] && args+=(-f "$f")
          done <<<"$CONTAINERFILES"
          while read -r a; do
            [ -n "$a" ] && args+=(--build-arg "$a")
          done <<<"$BUILD_ARGS"
          buildah build --platform "$PLATFORM" "${args[@]}" -t image .

      - name: Push the per-arch image
        if: needs.plan.outputs.push == 'true'
        env:
          TAG: ${{ needs.plan.outputs.build_tag }}-${{ matrix.arch }}
        run: buildah push image "docker://$IMAGE_REF:$TAG"

      - name: Clean up the subscription
        if: always()
        env:
          SMDEV_CONTAINER_OFF: 1
        run: subscription-manager unregister

  merge:
    name: Publish the manifest list
    needs: [plan, subs]
    if: needs.plan.outputs.push == 'true' && needs.plan.outputs.promote != 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
      BUILD_TAG: ${{ needs.plan.outputs.build_tag }}
      BUILDS: ${{ needs.plan.outputs.builds }}
      TAGS: ${{ needs.plan.outputs.tags }}
    steps:
      - name: Log in to the GitHub Container registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | buildah login ghcr.io -u "$ACTOR" --password-stdin

      # The per-arch images are already in the repository, so only the list
      # itself is pushed.
      - name: Create and push the manifest list
        run: |
          buildah manifest create image
          for arch in $(jq -r '.[].arch' <<<"$BUILDS"); do
            buildah manifest add image "docker://$IMAGE_REF:$BUILD_TAG-$arch"
          done
          buildah manifest inspect image
          for tag in $TAGS; do
            buildah manifest push --all=false image "docker://$IMAGE_REF:$tag"
          done

  prune:
    name: Prune old image versions
    needs: [plan, promote, merge]
    if: >-
      always()
      && inputs.publish
      && github.ref_name == github.event.repository.default_branch
      && (needs.promote.result == 'success' || needs.merge.result == 'success')
    uses: ./.github/workflows/prune-ghcr.yml
    with:
      package: ${{ inputs.image_name }}
    permissions:
      packages: write
