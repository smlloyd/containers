name: Build keycloak-postgres image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "keycloak-postgres/**"
      - .github/workflows/keycloak-postgres.yml
      - .github/workflows/docker-publish.yml
  pull_request:
    branches:
      - main
    paths:
      - "keycloak-postgres/**"
      - .github/workflows/keycloak-postgres.yml
      - .github/workflows/docker-publish.yml

jobs:
  build_image:
    name: Build keycloak-postgres image
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_name: keycloak-postgres
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
