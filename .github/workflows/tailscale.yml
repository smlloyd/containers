name: Build tailscale image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tailscale/**"
      - .github/workflows/tailscale.yml
      - .github/workflows/docker-publish.yml
  pull_request:
    branches:
      - main
    paths:
      - "tailscale/**"
      - .github/workflows/tailscale.yml
      - .github/workflows/docker-publish.yml

jobs:
  build_image:
    name: Build tailscale image
    uses: ./.github/workflows/docker-publish.yml
    with:
      image_name: tailscale
    permissions:
      contents: read
      packages: write
      id-token: write
    secrets: inherit
